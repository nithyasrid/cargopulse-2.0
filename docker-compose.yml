services:
  postgres:
    image: postgres:16
    container_name: cargopulse-postgres
    environment:
      POSTGRES_DB: cargopulse
      POSTGRES_USER: cargopulse
      POSTGRES_PASSWORD: cargopulse
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cargopulse -d cargopulse"]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka:
    image: bitnami/kafka:3.8
    container_name: cargopulse-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093,EXTERNAL://:9092
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_KRAFT_CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      ALLOW_PLAINTEXT_LISTENER: "yes"
    healthcheck:
      test: ["CMD-SHELL", "/opt/bitnami/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20

  spark:
    build:
      context: ./data-engineering/spark
    container_name: cargopulse-spark
    environment:
      SPARK_MODE: master
    ports:
      - "8082:8080"
      - "7077:7077"
    volumes:
      - ./data-engineering/spark:/opt/spark-apps
      - spark_checkpoints:/tmp/cargopulse-checkpoints
    command: >
      bash -c "mkdir -p /tmp/cargopulse-checkpoints &&
      /opt/bitnami/spark/sbin/start-master.sh &&
      tail -f /dev/null"
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy

  spark-stream:
    build:
      context: ./data-engineering/spark
    container_name: cargopulse-spark-stream
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC: shipment-events
    volumes:
      - ./data-engineering/spark:/opt/spark-apps
      - spark_checkpoints:/tmp/cargopulse-checkpoints
    command: >
      bash -c "sleep 15 &&
      spark-submit
      --master spark://spark:7077
      --packages org.postgresql:postgresql:42.7.4,org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.2
      /opt/spark-apps/shipment_stream.py"
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      spark:
        condition: service_started

  spark-worker:
    image: bitnami/spark:3.5
    container_name: cargopulse-spark-worker
    environment:
      SPARK_MODE: worker
      SPARK_MASTER_URL: spark://spark:7077
      SPARK_WORKER_MEMORY: 1G
      SPARK_WORKER_CORES: 1
    depends_on:
      - spark

  airflow:
    image: apache/airflow:2.10.3
    container_name: cargopulse-airflow
    user: "0:0"
    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__SECRET_KEY: cargopulse-secret
      _PIP_ADDITIONAL_REQUIREMENTS: apache-airflow-providers-postgres==6.0.0
    ports:
      - "8081:8080"
    volumes:
      - ./orchestration/dags:/opt/airflow/dags
    command: >
      bash -c "airflow db migrate &&
      airflow users create --username admin --password admin --firstname Cargo --lastname Pulse --role Admin --email admin@cargopulse.local || true &&
      airflow scheduler & airflow webserver"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ./java-backend/cargo-pulse-api
    container_name: cargopulse-api
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/cargopulse
      SPRING_DATASOURCE_USERNAME: cargopulse
      SPRING_DATASOURCE_PASSWORD: cargopulse
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC: shipment-events
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  event-producer:
    build:
      context: ./data-engineering/ingestion/kafka-producers
    container_name: cargopulse-event-producer
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC: shipment-events
    depends_on:
      kafka:
        condition: service_healthy
    profiles: ["tools"]

  dashboard:
    build:
      context: ./dashboards
    container_name: cargopulse-dashboard
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: cargopulse
      POSTGRES_USER: cargopulse
      POSTGRES_PASSWORD: cargopulse
    ports:
      - "8501:8501"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  spark_checkpoints:
